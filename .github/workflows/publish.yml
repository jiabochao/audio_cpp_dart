# Publishes to pub.dev when a version tag (e.g. v0.1.1) is pushed.
# Requires automated publishing to be enabled on pub.dev
# (package Admin → Automated publishing, repository jiabochao/audio_cpp_dart,
# tag pattern `v{{version}}`).
name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    permissions:
      id-token: write # Required for OIDC authentication with pub.dev.
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
