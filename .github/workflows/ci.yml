name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP: example/flutter_app

jobs:
  analyze:
    name: Analyze & bindings up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed lib hook test tool example/audio_cpp_dart_example.dart
      - run: dart analyze --fatal-infos
      - name: Regenerate FFI bindings
        run: |
          dart run tool/ffigen.dart
          git diff --exit-code lib/src/bindings

  # Prebuilt release libraries: every desktop target audio.cpp publishes.
  dart-prebuilt:
    name: Dart · ${{ matrix.name }} · prebuilt
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-latest }
          - { name: windows-x64, os: windows-latest }
          - { name: macos-arm64, os: macos-latest }
          - { name: macos-x64, os: macos-15-intel }
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart test --reporter expanded
      - name: AOT bundle (dart build cli) runs
        shell: bash
        run: |
          dart build cli -t example/audio_cpp_dart_example.dart -o build/cli-out
          ls -R build/cli-out/bundle
          exe=build/cli-out/bundle/bin/audio_cpp_dart_example
          [ -f "$exe.exe" ] && exe="$exe.exe"
          "$exe" vad test/fixtures/silero_vad test/fixtures/sample_16k.wav | tee out.txt
          grep -q '^speech ' out.txt

  # Source builds through the hook's CMake driver.
  dart-source:
    name: Dart · ${{ matrix.name }} · source build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # No upstream prebuilt for linux-arm64: `auto` falls back to source.
          - { name: linux-arm64, os: ubuntu-24.04-arm, source: auto }
          - { name: linux-x64, os: ubuntu-latest, source: build }
          - { name: macos-arm64, os: macos-latest, source: build }
          - { name: windows-x64, os: windows-latest, source: build }
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Configure hook user-defines
        shell: bash
        run: |
          cat >> pubspec.yaml <<EOF

          hooks:
            user_defines:
              audio_cpp_dart:
                source: ${{ matrix.source }}
                model_set: core
          EOF
          cat pubspec.yaml
      - run: dart pub get
      - run: dart test --reporter expanded test/audio_cpp_dart_test.dart

  flutter-desktop:
    name: Flutter · ${{ matrix.device }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { device: linux, os: ubuntu-latest }
          - { device: windows, os: windows-latest }
          - { device: macos, os: macos-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config xvfb
      - name: Generate platform folder
        working-directory: ${{ env.APP }}
        shell: bash
        run: |
          flutter create --platforms=${{ matrix.device }} --project-name audio_cpp_flutter_example --org dev.audiocpp .
          rm -rf test
      - working-directory: ${{ env.APP }}
        run: flutter analyze
      - name: Integration test
        working-directory: ${{ env.APP }}
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a flutter test integration_test -d linux
          else
            flutter test integration_test -d ${{ matrix.device }}
          fi

  flutter-android:
    name: Flutter · android (emulator x86_64 + release build)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Generate platform folder
        working-directory: ${{ env.APP }}
        run: |
          flutter create --platforms=android --project-name audio_cpp_flutter_example --org dev.audiocpp .
          rm -rf test
      - name: Build APK for the emulator (x86_64)
        working-directory: ${{ env.APP }}
        run: flutter build apk --debug --target-platform android-x64
      - name: Integration test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: ${{ env.APP }}
          script: flutter test integration_test -d emulator-5554
      - name: Build release APK for devices (arm, arm64, x64)
        working-directory: ${{ env.APP }}
        run: |
          flutter build apk --release
          unzip -l build/app/outputs/flutter-apk/app-release.apk | grep libaudiocpp.so

  flutter-ios:
    name: Flutter · ios (simulator + device build)
    runs-on: macos-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate platform folder
        working-directory: ${{ env.APP }}
        run: |
          flutter create --platforms=ios --project-name audio_cpp_flutter_example --org dev.audiocpp .
          rm -rf test
      - name: Boot simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              if "iOS" not in runtime:
                  continue
              for d in devices[runtime]:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit()
          ')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid"
      - name: Integration test on simulator
        working-directory: ${{ env.APP }}
        run: flutter test integration_test -d ${{ steps.sim.outputs.udid }}
      - name: Build for devices (arm64, unsigned)
        working-directory: ${{ env.APP }}
        run: |
          flutter build ios --release --no-codesign
          find build/ios/iphoneos -name 'audiocpp*' -maxdepth 4
