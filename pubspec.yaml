name: audio_cpp_dart
description: >-
  Dart FFI bindings for audio.cpp (TTS, ASR, VAD, diarization, separation and
  more on ggml), shipped as a native asset through build hooks.
version: 0.1.0
repository: https://github.com/jiabochao/audio_cpp_dart
issue_tracker: https://github.com/jiabochao/audio_cpp_dart/issues
topics:
  - ffi
  - audio
  - speech
  - tts
  - asr

environment:
  sdk: ^3.10.0

platforms:
  android:
  ios:
  linux:
  macos:
  windows:

dependencies:
  archive: ^4.0.7
  code_assets: ^2.1.0
  crypto: ^3.0.6
  ffi: ^2.1.4
  hooks: ^2.2.0
  logging: ^1.3.0

dev_dependencies:
  ffigen: ^23.0.0
  lints: ^6.0.0
  test: ^1.26.0
